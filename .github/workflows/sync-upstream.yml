name: Sync Fork from Upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点（北京时间早 8 点）自动同步一次
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取完整历史，merge 需要

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/laoma528/awesome-zhuiju-free.git
          git fetch upstream
          git merge upstream/main --no-edit || git merge --abort && echo "有冲突，跳过本次同步" && exit 1
          git push origin main
